                                }`}
                            >
                                <Icon name="DropletFilled" className={`w-4 h-4 ${isAllSelectedInPeriod ? 'text-red-500' : ''}`} />
                                <span>{isAllSelectedInPeriod ? '取消經期' : '經期'}</span>
                            </button>
                            <button
                                type="button"
                                onClick={handleDeleteSelected}
                                disabled={!hasAnyDeletableContent}
                                className={`py-3.5 rounded-2xl text-xs sm:text-sm font-black transition-all shadow-sm flex items-center justify-center gap-1.5 ${
                                    !hasAnyDeletableContent
                                        ? 'bg-gray-100 text-gray-300 cursor-not-allowed'
                                        : 'bg-red-50 hover:bg-red-100 text-red-600 active:scale-95'
                                }`}
                            >
                                <Icon name="Trash" className="w-4 h-4" />
                                <span>刪除</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    setSelectedDates([]);
                                    setNonConsecutiveNotice(false);
                                }}
                                disabled={sortedSelectedDates.length === 0}
                                className={`py-3.5 rounded-2xl text-xs sm:text-sm font-black transition-all shadow-sm flex items-center justify-center gap-1.5 ${
                                    sortedSelectedDates.length === 0
                                        ? 'bg-gray-100 text-gray-300 cursor-not-allowed'
                                        : 'bg-gray-100 hover:bg-gray-200 text-gray-600 active:scale-95'
                                }`}
                            >
                                <Icon name="X" className="w-4 h-4" />
                                <span>取消選取</span>
                            </button>
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                            {NOTE_ICONS.map(item => {
                                const isChecked = sortedSelectedDates.length > 0 && sortedSelectedDates.every(d => notes[d]?.icons?.includes(item.id));
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        disabled={sortedSelectedDates.length === 0}
                                        onClick={() => toggleNoteIconBatch(item.id)}
                                        className={`p-4 rounded-2xl border text-center transition-all flex flex-col items-center gap-1.5 ${
                                            sortedSelectedDates.length === 0
                                                ? 'bg-gray-50 border-gray-50 text-gray-300 opacity-60 cursor-not-allowed'
                                                : isChecked
                                                    ? 'bg-rose-100 border-rose-400 text-rose-800 font-bold shadow-sm active:scale-90'
                                                    : 'bg-gray-50 border-gray-50 text-gray-500 active:scale-90'
                                        }`}
                                    >
                                        <span className="text-3xl leading-none">{item.emoji}</span>
                                        <span className="text-xs font-bold">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>

                        <div>
                            <div className="mb-2">
                                <label className="text-xs font-bold text-gray-600">備忘記事</label>
                            </div>
                            <textarea
                                rows="2"
                                placeholder={sortedSelectedDates.length === 0 ? "請先點選日期以記錄備忘..." : "寫下身體狀況或備忘..."}
                                disabled={sortedSelectedDates.length === 0}
                                value={primaryDateStr ? (notes[primaryDateStr]?.note || "") : ""}
                                onChange={(e) => updateNoteTextBatch(e.target.value)}
                                onBlur={() => saveToCloud(periods, notes)}
                                className={`w-full bg-rose-50/40 border border-rose-100 rounded-2xl p-3 text-sm text-gray-700 outline-none focus:border-rose-400 focus:bg-white transition-all resize-none ${
                                    sortedSelectedDates.length === 0 ? 'opacity-60 cursor-not-allowed' : ''
                                }`}
                            ></textarea>
                        </div>
                    </div>

                    {mergePrompt && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-xs w-full space-y-4 border border-rose-100">
                                <div className="flex items-center gap-2 text-rose-600 font-bold text-base">
                                    <Icon name="DropletFilled" className="w-5 h-5 text-red-500" />
                                    <span>選擇合併方向</span>
                                </div>
                                <p className="text-xs text-gray-600 leading-relaxed">
                                    選取的日期 <span className="font-mono font-bold text-red-600">{mergePrompt.targetDate}</span> 前後 3 天內皆有經期，請問要合併至哪一個經期？
                                </p>
                                <div className="space-y-2 pt-1">
                                    <button
                                        type="button"
                                        onClick={() => applyMerge('before', mergePrompt.before, mergePrompt.targetDate)}
                                        className="w-full p-3.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-2xl text-xs font-bold text-left transition-all flex justify-between items-center active:scale-95"
                                    >
                                        <div>
                                            <div className="text-[10px] text-rose-400 font-bold">合併至前一個經期</div>
                                            <div className="font-mono font-bold mt-0.5">{mergePrompt.before.start} ~ {mergePrompt.targetDate}</div>
                                        </div>
                                        <span className="text-rose-600 font-black text-xs">選擇</span>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => applyMerge('after', mergePrompt.after, mergePrompt.targetDate)}
                                        className="w-full p-3.5 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-2xl text-xs font-bold text-left transition-all flex justify-between items-center active:scale-95"
                                    >
                                        <div>
                                            <div className="text-[10px] text-purple-400 font-bold">合併至後一個經期</div>
                                            <div className="font-mono font-bold mt-0.5">{mergePrompt.targetDate} ~ {mergePrompt.after.end}</div>
                                        </div>
                                        <span className="text-purple-600 font-black text-xs">選擇</span>
                                    </button>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setMergePrompt(null)}
                                    className="w-full py-2 text-xs text-gray-400 font-bold hover:text-gray-600 transition-all text-center"
                                >
                                    取消
                                </button>
                            </div>
                        </div>
                    )}

                    {showRestoreModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full space-y-4 border border-rose-100">
                                <div className="flex items-center justify-between border-b border-rose-50 pb-2">
                                    <div className="flex items-center gap-2 text-rose-600 font-bold text-sm">
                                        <Icon name="Upload" className="w-4 h-4" />
                                        <span>讀取備份資料</span>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => { setShowRestoreModal(false); setRestoreText(""); }}
                                        className="text-gray-400 hover:text-gray-600 font-bold text-xs"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <p className="text-xs text-gray-500 leading-relaxed">
                                    請選擇先前匯出的 <span className="font-mono font-bold text-rose-600">.json</span> 備份檔案，或直接在下方貼上備份文字：
                                </p>

                                <button
                                    type="button"
                                    onClick={() => fileInputRef.current?.click()}
                                    className="w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-2xl text-xs font-bold transition-all flex items-center justify-center gap-2 active:scale-95 cursor-pointer border border-rose-200"
                                >
                                    <Icon name="Download" className="w-4 h-4 rotate-180 text-rose-600" />
                                    <span>選擇備份檔案 (.json)</span>
                                </button>

                                <div className="flex items-center gap-2 text-[10px] text-gray-300 font-bold">
                                    <div className="flex-1 h-[1px] bg-gray-100"></div>
                                    <span>或貼上備份代碼</span>
                                    <div className="flex-1 h-[1px] bg-gray-100"></div>
                                </div>

                                <textarea
                                    rows="3"
                                    placeholder="在此處貼上複製的備份文字代碼..."
                                    value={restoreText}
                                    onChange={(e) => setRestoreText(e.target.value)}
                                    className="w-full bg-rose-50/30 border border-rose-100 rounded-xl p-2.5 text-xs text-gray-700 outline-none focus:border-rose-400 font-mono resize-none"
                                ></textarea>

                                <div className="flex gap-2">
                                    <button
                                        type="button"
                                        onClick={() => { setShowRestoreModal(false); setRestoreText(""); }}
                                        className="w-1/2 py-2.5 text-xs text-gray-500 bg-gray-100 hover:bg-gray-200 font-bold rounded-xl transition-all"
                                    >
                                        取消
                                    </button>
                                    <button
                                        type="button"
                                        disabled={!restoreText.trim()}
                                        onClick={() => applyBackupData(restoreText)}
                                        className={`w-1/2 py-2.5 text-xs font-bold rounded-xl transition-all ${
                                            restoreText.trim()
                                                ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-sm shadow-rose-200 active:scale-95 cursor-pointer'
                                                : 'bg-gray-100 text-gray-300 cursor-not-allowed'
                                        }`}
                                    >
                                        匯入代碼
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        //         最外層主控元件 (App)
        // ==========================================

        const App = () => {
            const getInitialTab = () => {
                const tab = new URLSearchParams(window.location.search).get('tab');
                if (tab === 'wine') return 'wine';
                if (tab === 'period') return 'period';
                return 'expense';
            };
            const [activeTab, setActiveTab] = React.useState(getInitialTab);
            const [authStatus, setAuthStatus] = React.useState('loading');
            const [apiToken, setApiToken] = React.useState("");
            const [inputToken, setInputToken] = React.useState("");
            const [authErrorMsg, setAuthErrorMsg] = React.useState("");

            const expenseApiUrl = 'https://script.google.com/macros/s/AKfycbxyB9Z2sJHxJ3533aqEYnCxMecQShD5nUBBsfYsJpgeM2aPOXTMKU44gwM8IS7M9eYU/exec';
            const wineApiUrl = 'https://script.google.com/macros/s/AKfycbylZOr-mY4m822xXNBZgp7uAaeJ_6eT-ZxwZYc9YGNdweiyz5x7l0U8ekSaY9_9MVrP/exec';
            const verifyToken = React.useCallback((idToVerify) => {
                if (!idToVerify) return;
                const cleanedId = idToVerify.replace(/["']/g, "").trim();
                setAuthStatus('loading');
                setAuthErrorMsg("");

                let isMounted = true;
                let timeoutId;

                window.onVerifySharedResult = (res) => {
                    if (!isMounted) return;
                    if (timeoutId) clearTimeout(timeoutId);
                    if (res && res.auth === 'OK') {
                        setApiToken(cleanedId);
                        safeStorage.setItem('api_token_id', cleanedId);
                        setTimeout(() => { if (isMounted) setAuthStatus('authorized'); }, 100);
                    } else {
                        safeStorage.removeItem('api_token_id');
                        if (isMounted) {
                            setAuthStatus('denied');
                            setAuthErrorMsg('驗證失敗，請確認金鑰是否正確！');
                        }
                    }
                    const s = document.getElementById('v-script-shared');
                    if (s) s.remove();
                };

                timeoutId = setTimeout(() => {
                    if (isMounted) {
                        setAuthStatus('denied');
                        setAuthErrorMsg('連線逾時，請檢查網路連線或稍後再試！');
                    }
                    const s = document.getElementById('v-script-shared');
                    if (s) s.remove();
                }, 8000);

                const script = document.createElement('script');
                script.id = 'v-script-shared';
                script.src = `${expenseApiUrl}?action=verify&id=${encodeURIComponent(cleanedId)}&callback=onVerifySharedResult&_t=${Date.now()}`;
                document.body.appendChild(script);
            }, [expenseApiUrl]);

            React.useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                let id = params.get('id');
                if (!id) {
                    id = safeStorage.getItem('api_token_id');
                }
                if (!id) {
                    setAuthStatus('denied');
                    return;
                }
                verifyToken(id);
            }, [verifyToken]);

            React.useEffect(() => {
                if (activeTab === 'expense') {
                    document.body.className = 'theme-expense';
                    document.documentElement.style.setProperty('--scrollbar-thumb-color', '#F8BBD0');
                } else if (activeTab === 'wine') {
                    document.body.className = 'theme-wine';
                    document.documentElement.style.setProperty('--scrollbar-thumb-color', '#fbbf24');
                } else if (activeTab === 'period') {
                    document.body.className = 'theme-period';
                    document.documentElement.style.setProperty('--scrollbar-thumb-color', '#FECDD3');
                }
            }, [activeTab]);

            if (authStatus === 'loading') {
                const loaderColorClass = activeTab === 'expense' ? 'text-pink-600' : activeTab === 'wine' ? 'text-amber-500' : 'text-rose-600';
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#FCE4EC] text-pink-700 font-bold px-10 text-center">
                        <div className="space-y-6">
                            <Icon name="Loader" className={`w-16 h-16 mx-auto ${loaderColorClass}`} />
                            <div className="space-y-2">
                                <p className="tracking-[0.2em] uppercase italic text-xl font-black">正在安全驗證中...</p>
                                <p className="text-xs text-slate-400 font-medium tracking-widest">正在連線至伺服器驗證權限</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (authStatus === 'denied') {
                const handleManualLogin = (e) => {
                    e.preventDefault();
                    if (!inputToken.trim()) return;
                    verifyToken(inputToken.trim());
                };

                const cardBorder = activeTab === 'expense' ? 'border-pink-100' : activeTab === 'wine' ? 'border-amber-900/20' : 'border-rose-100';
                const keyColorClass = activeTab === 'expense' ? 'text-pink-600' : activeTab === 'wine' ? 'text-amber-900' : 'text-rose-600';
                const buttonBg = activeTab === 'expense' ? 'bg-pink-500 hover:bg-pink-600 shadow-pink-100' : activeTab === 'wine' ? 'bg-amber-900 hover:bg-amber-950 shadow-amber-100' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-100';
                const focusBorder = activeTab === 'expense' ? 'focus:border-pink-500 hover:border-pink-200' : activeTab === 'wine' ? 'focus:border-amber-900 hover:border-amber-200' : 'focus:border-rose-500 hover:border-rose-200';

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="sticky top-0 z-[150] w-full max-w-md mx-auto px-4 pt-4 pb-2">
                            <div className="glass-card rounded-3xl p-1.5 flex justify-between items-center shadow-lg border border-white/20 backdrop-blur-md bg-white/40 gap-1">
                                <button
                                    onClick={() => setActiveTab('expense')}
                                    className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'expense'
                                        ? 'bg-pink-500 text-white shadow-md scale-[1.02]'
                                        : 'text-gray-500 hover:text-pink-500 bg-transparent'
                                        }`}
                                >
                                    <span>💰</span>
                                    <span>記帳本</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('wine')}
                                    className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'wine'
                                        ? 'bg-amber-900 text-white shadow-md scale-[1.02]'
                                        : 'text-gray-600 hover:text-amber-900 bg-transparent'
                                        }`}
                                >
                                    <span>🍺</span>
                                    <span>微醺時光</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('period')}
                                    className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'period'
                                        ? 'bg-rose-600 text-white shadow-md scale-[1.02]'
                                        : 'text-gray-600 hover:text-rose-600 bg-transparent'
                                        }`}
                                >
                                    <span>🌸</span>
                                    <span>生理期日誌</span>
                                </button>
                            </div>
                        </header>

                        {activeTab === 'period' ? (
                            <main className="flex-1">
                                <PeriodApp apiToken={apiToken} apiUrl={wineApiUrl} />
                            </main>
                        ) : (
                            <div className="flex-1 flex items-center justify-center px-6 py-6 pb-20">
                                <div className={`bg-white rounded-3xl p-8 max-w-md w-full shadow-xl space-y-6 border ${cardBorder} text-center animate-in fade-in duration-300`}>
                                    <div className="text-6xl animate-bounce">🔑</div>
                                    <div className="space-y-2">
                                        <h2 className={`text-2xl font-black ${keyColorClass} tracking-tight`}>需要授權金鑰 (ID)</h2>
                                        <p className="text-sm text-gray-500 font-medium">請輸入您的金鑰以載入雲端試算表記錄</p>
                                    </div>
                                    {authErrorMsg && (
                                        <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-bold rounded-2xl animate-in fade-in">
                                            ⚠️ {authErrorMsg}
                                        </div>
                                    )}
                                    <form onSubmit={handleManualLogin} className="space-y-4 text-left">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 pl-1">授權金鑰 / ID</label>
                                            <input
                                                required
                                                type="password"
                                                placeholder="請貼上或輸入金鑰..."
                                                value={inputToken}
                                                onChange={(e) => setInputToken(e.target.value)}
                                                className={`w-full border-2 border-gray-100 ${focusBorder} rounded-2xl py-4 px-5 outline-none transition-all text-base font-mono font-bold text-gray-700 bg-gray-50 placeholder:text-gray-300`}
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            className={`w-full py-4 rounded-2xl font-bold text-white ${buttonBg} shadow-lg transition-all active:scale-95 cursor-pointer text-center text-lg tracking-widest`}
                                        >
                                            確認驗證
                                        </button>
                                    </form>
                                    <div className="text-[10px] text-gray-400 font-medium leading-relaxed pt-2 border-t border-gray-50">
                                        驗證成功後，此裝置將自動記憶金鑰。<br />
                                        （生理期日誌為離線版，可隨時點上方切換使用）
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="sticky top-0 z-[150] w-full max-w-md mx-auto px-4 pt-4 pb-2">
                        <div className="glass-card rounded-3xl p-1.5 flex justify-between items-center shadow-lg border border-white/20 backdrop-blur-md bg-white/40 gap-1">
                            <button
                                onClick={() => setActiveTab('expense')}
                                className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'expense'
                                    ? 'bg-pink-500 text-white shadow-md scale-[1.02]'
                                    : 'text-gray-500 hover:text-pink-500 bg-transparent'
                                    }`}
                            >
                                <span>💰</span>
                                <span>記帳本</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('wine')}
                                className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'wine'
                                    ? 'bg-amber-900 text-white shadow-md scale-[1.02]'
                                    : 'text-gray-600 hover:text-amber-900 bg-transparent'
                                    }`}
                            >
                                <span>🍺</span>
                                <span>微醺時光</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('period')}
                                className={`flex-1 py-3 px-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm tracking-wider transition-all duration-300 flex items-center justify-center space-x-1 cursor-pointer ${activeTab === 'period'
                                    ? 'bg-rose-600 text-white shadow-md scale-[1.02]'
                                    : 'text-gray-600 hover:text-rose-600 bg-transparent'
                                    }`}
                            >
                                <span>🌸</span>
                                <span>生理期日誌</span>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1">
                        {activeTab === 'expense' && <ExpenseApp apiToken={apiToken} />}
                        {activeTab === 'wine' && <WineApp apiToken={apiToken} />}
                        {activeTab === 'period' && <PeriodApp apiToken={apiToken} apiUrl={wineApiUrl} />}
                    </main>
                </div>
            );
        };

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (error) {
            document.body.innerHTML = `<div style="padding: 2rem; color: #E11D48; font-weight: bold; text-align: center; font-size: 1.2rem;"><h2>React 渲染失敗</h2><p>${error.message}</p></div>`;
            console.error(error);
        }
    </script>

    <script>
        // 安全清理 Service Worker 快取，防範 iframe 容器中 invalid state 錯誤
        try {
            if (typeof window !== 'undefined' && 'serviceWorker' in navigator && window.isSecureContext) {
                window.addEventListener('load', function() {
                    try {
                        navigator.serviceWorker.getRegistrations().then(function(registrations) {
                            if (registrations && registrations.length > 0) {
                                for (let registration of registrations) {
                                    registration.unregister().catch(() => {});
                                }
                            }
                        }).catch(function(err) {
                            // 靜默捕捉在受限環境/沙盒下的 InvalidStateError
                        });
                    } catch (e) {}
                });
            }
        } catch (e) {}

        try {
            if ('caches' in window) {
                caches.keys().then((keyList) => {
                    return Promise.all(keyList.map((key) => caches.delete(key)));
                }).catch(() => {});
            }
        } catch (e) {}
    </script>
</body>

</html>
