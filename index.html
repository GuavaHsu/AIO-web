                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        //         生理期日誌元件 (PeriodApp)
        // ==========================================

        const safeStorage = {
            getItem: (key) => {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn("Storage access restricted, fallback to memStore.", e);
                    return window._memStore?.[key] || null;
                }
            },
            setItem: (key, val) => {
                try {
                    localStorage.setItem(key, val);
                } catch (e) {
                    if (!window._memStore) window._memStore = {};
                    window._memStore[key] = val;
                }
            },
            removeItem: (key) => {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    if (window._memStore) delete window._memStore[key];
                }
            }
        };

        const NOTE_ICONS = [
            { id: "pain", emoji: "😣", label: "經痛" },
            { id: "love", emoji: "🍱", label: "親密" },
            { id: "pill", emoji: "💊", label: "吃藥" }
        ];

        const toDateStr = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const parseDateStr = (str) => {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const addDays = (dateStr, days) => {
            const d = parseDateStr(dateStr);
            d.setDate(d.getDate() + days);
            return toDateStr(d);
        };

        const diffDays = (startStr, endStr) => {
            const d1 = parseDateStr(startStr);
            const d2 = parseDateStr(endStr);
            return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        };

        const PeriodApp = ({ apiToken, apiUrl }) => {
            const [useDefaultParams, setUseDefaultParams] = React.useState(() => {
                const saved = safeStorage.getItem('period_use_default_v4');
                return saved !== null ? JSON.parse(saved) : true;
            });
            const [cycleLength, setCycleLength] = React.useState(() => {
                const saved = safeStorage.getItem('period_cycle_len_v4');
                return saved ? Number(saved) : 28;
            });
            const [periodDuration, setPeriodDuration] = React.useState(() => {
                const saved = safeStorage.getItem('period_duration_v4');
                return saved ? Number(saved) : 6;
            });
            const [showFertileWindow, setShowFertileWindow] = React.useState(() => {
                const saved = safeStorage.getItem('period_show_fertile_v4');
                return saved !== null ? JSON.parse(saved) : true;
            });

            const [showSettings, setShowSettings] = React.useState(false);
            const [showStats, setShowStats] = React.useState(false);
            const [mergePrompt, setMergePrompt] = React.useState(null);
            const [nonConsecutiveNotice, setNonConsecutiveNotice] = React.useState(false);

            // SWR 秒開：如果有本地快取，不阻擋操作；雲端背景進行靜默確認
            const [cloudStatus, setCloudStatus] = React.useState('idle');
            const [lastCloudSyncTime, setLastCloudSyncTime] = React.useState(null);

            const [backupNotice, setBackupNotice] = React.useState(null);
            const [showRestoreModal, setShowRestoreModal] = React.useState(false);
            const [restoreText, setRestoreText] = React.useState("");
            const fileInputRef = React.useRef(null);

            const today = new Date();
            const [viewDate, setViewDate] = React.useState(new Date(today.getFullYear(), today.getMonth(), 1));
            const [selectedDates, setSelectedDates] = React.useState([]);
            const [slideDir, setSlideDir] = React.useState("");

            const isMouseDownRef = React.useRef(false);
            const dragStartRef = React.useRef(null);
            const hasDraggedRef = React.useRef(false);

            React.useEffect(() => {
                const handleGlobalMouseUp = () => {
                    isMouseDownRef.current = false;
                    dragStartRef.current = null;
                };
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, []);

            const [periods, setPeriods] = React.useState(() => {
                const saved = safeStorage.getItem('period_ranges_v4');
                return saved ? JSON.parse(saved) : [];
            });

            const [notes, setNotes] = React.useState(() => {
                const saved = safeStorage.getItem('period_notes_v4');
                return saved ? JSON.parse(saved) : {};
            });

            // 本地快取自動備存
            React.useEffect(() => { safeStorage.setItem('period_use_default_v4', JSON.stringify(useDefaultParams)); }, [useDefaultParams]);
            React.useEffect(() => { safeStorage.setItem('period_cycle_len_v4', String(cycleLength)); }, [cycleLength]);
            React.useEffect(() => { safeStorage.setItem('period_duration_v4', String(periodDuration)); }, [periodDuration]);
            React.useEffect(() => { safeStorage.setItem('period_show_fertile_v4', JSON.stringify(showFertileWindow)); }, [showFertileWindow]);
            React.useEffect(() => { safeStorage.setItem('period_ranges_v4', JSON.stringify(periods)); }, [periods]);
            React.useEffect(() => { safeStorage.setItem('period_notes_v4', JSON.stringify(notes)); }, [notes]);

            // --- 經期區間清理與自動鄰接合併演算法 ---
            const cleanAndMergePeriods = React.useCallback((list) => {
                if (!list || list.length === 0) return [];
                const sorted = [...list]
                    .map(p => ({
                        id: p.id || Math.random().toString(),
                        start: p.start <= p.end ? p.start : p.end,
                        end: p.start <= p.end ? p.end : p.start,
                        isClosed: p.isClosed === false ? false : true
                    }))
                    .sort((a, b) => a.start.localeCompare(b.start));

                const merged = [];
                for (const cur of sorted) {
                    if (merged.length === 0) {
                        merged.push(cur);
                    } else {
                        const prev = merged[merged.length - 1];
                        if (cur.start <= addDays(prev.end, 1)) {
                            if (cur.end > prev.end) {
                                prev.end = cur.end;
                            }
                            prev.isClosed = (prev.isClosed === false || cur.isClosed === false) ? false : true;
                        } else {
                            merged.push(cur);
                        }
                    }
                }
                return merged;
            }, []);

            // --- 雲端試算表儲存 (POST) ---
            const saveToCloud = React.useCallback((updatedPeriods, updatedNotes, updatedSettings) => {
                if (!apiUrl || !apiToken) return;
                setCloudStatus('saving');

                const nowTs = Date.now();
                safeStorage.setItem('period_local_updated_at', String(nowTs));

                const targetPeriods = updatedPeriods !== undefined ? updatedPeriods : periods;
                const targetNotes = updatedNotes !== undefined ? updatedNotes : notes;
                const targetSettings = updatedSettings !== undefined ? updatedSettings : {
                    useDefaultParams,
                    cycleLength,
                    periodDuration,
                    showFertileWindow
                };

                const payload = {
                    type: 'period',
                    api_token: apiToken,
                    updatedAt: nowTs,
                    periods: targetPeriods,
                    notes: targetNotes,
                    settings: targetSettings
                };

                fetch(apiUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload), keepalive: true })
                    .then(() => {
                        setCloudStatus('synced');
                        const now = new Intl.DateTimeFormat('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
                        setLastCloudSyncTime(now);
                    })
                    .catch(() => {
                        setCloudStatus('error');
                    });
            }, [apiUrl, apiToken, periods, notes, useDefaultParams, cycleLength, periodDuration, showFertileWindow]);

            // 用 Ref 保持 saveToCloud 的引用，避免 fetchFromCloud 造成循環依賴
            const saveToCloudRef = React.useRef(saveToCloud);
            React.useEffect(() => {
                saveToCloudRef.current = saveToCloud;
            }, [saveToCloud]);

            // --- 雲端試算表讀取 (修正依賴與逾時，徹底消除卡在載入中的問題) ---
            const fetchFromCloud = React.useCallback(() => {
                if (!apiUrl || !apiToken) return;
                setCloudStatus('loading');

                const callbackName = 'onGetPeriodResult_' + Date.now();
                let isHandled = false;

                // 逾時安全防護：若 4.5 秒內未回應，自動還原狀態，不卡住使用者
                const timeoutId = setTimeout(() => {
                    if (!isHandled) {
                        isHandled = true;
                        setCloudStatus('synced');
                        const s = document.getElementById(callbackName);
                        if (s) s.remove();
                        if (window[callbackName]) delete window[callbackName];
                    }
                }, 4500);

                window[callbackName] = (res) => {
                    if (isHandled) return;
                    isHandled = true;
                    clearTimeout(timeoutId);

                    if (res && res.status === 'success' && res.data) {
                        const cloudData = res.data;
                        const cloudTimestamp = Number(cloudData.updatedAt || 0);
                        const localTimestamp = Number(safeStorage.getItem('period_local_updated_at') || 0);

                        const localSavedP = safeStorage.getItem('period_ranges_v4');
                        const currentLocalP = localSavedP ? JSON.parse(localSavedP) : [];
                        const localSavedN = safeStorage.getItem('period_notes_v4');
                        const currentLocalN = localSavedN ? JSON.parse(localSavedN) : {};

                        if (cloudTimestamp >= localTimestamp) {
                            const cleanedCloudPeriods = cleanAndMergePeriods(cloudData.periods || []);
                            const cloudNotes = cloudData.notes || {};
                            setPeriods(cleanedCloudPeriods);
                            setNotes(cloudNotes);
                            safeStorage.setItem('period_ranges_v4', JSON.stringify(cleanedCloudPeriods));
                            safeStorage.setItem('period_notes_v4', JSON.stringify(cloudNotes));
                            safeStorage.setItem('period_local_updated_at', String(cloudTimestamp));

                            if (cloudData.settings) {
                                if (typeof cloudData.settings.useDefaultParams === 'boolean') setUseDefaultParams(cloudData.settings.useDefaultParams);
                                if (cloudData.settings.cycleLength) setCycleLength(Number(cloudData.settings.cycleLength));
                                if (cloudData.settings.periodDuration) setPeriodDuration(Number(cloudData.settings.periodDuration));
                                if (typeof cloudData.settings.showFertileWindow === 'boolean') setShowFertileWindow(cloudData.settings.showFertileWindow);
                            }
                        } else {
                            if (saveToCloudRef.current) {
                                saveToCloudRef.current(currentLocalP, currentLocalN);
                            }
                        }

                        setCloudStatus('synced');
                        if (res.updatedAt) setLastCloudSyncTime(res.updatedAt);
                    } else if (res && res.status === 'success' && !res.data) {
                        const localSavedP = safeStorage.getItem('period_ranges_v4');
                        const currentLocalP = localSavedP ? JSON.parse(localSavedP) : [];
                        const localSavedN = safeStorage.getItem('period_notes_v4');
                        const currentLocalN = localSavedN ? JSON.parse(localSavedN) : {};
                        if (currentLocalP.length > 0 || Object.keys(currentLocalN).length > 0) {
                            if (saveToCloudRef.current) {
                                saveToCloudRef.current(currentLocalP, currentLocalN);
                            }
                        }
                        setCloudStatus('synced');
                    } else {
                        setCloudStatus('synced');
                    }

                    delete window[callbackName];
                    const s = document.getElementById(callbackName);
                    if (s) s.remove();
                };

                const script = document.createElement('script');
                script.id = callbackName;
                script.src = `${apiUrl}?action=getPeriodData&id=${encodeURIComponent(apiToken)}&api_token=${encodeURIComponent(apiToken)}&callback=${callbackName}&_t=${Date.now()}`;
                script.onerror = () => {
                    if (!isHandled) {
                        isHandled = true;
                        clearTimeout(timeoutId);
                        setCloudStatus('synced');
                        if (window[callbackName]) delete window[callbackName];
                        const s = document.getElementById(callbackName);
                        if (s) s.remove();
                    }
                };
                document.body.appendChild(script);
            }, [apiUrl, apiToken, cleanAndMergePeriods]);

            // 僅在元件載入或 apiToken 變更時執行一次，不重入循環
            React.useEffect(() => {
                if (apiToken) {
                    fetchFromCloud();
                }
            }, [apiToken, fetchFromCloud]);

            const stats = React.useMemo(() => {
                if (periods.length === 0) {
                    return { avgCycle: null, avgDuration: null, count: 0, history: [] };
                }
                const sorted = [...periods].sort((a, b) => a.start.localeCompare(b.start));
                let totalDuration = 0;
                const history = [];

                for (let i = 0; i < sorted.length; i++) {
                    const cur = sorted[i];
                    const dur = diffDays(cur.start, cur.end) + 1;
                    totalDuration += dur;
                    let cycleDays = null;
                    if (i > 0) {
                        cycleDays = diffDays(sorted[i - 1].start, cur.start);
                    }
                    history.push({
                        ...cur,
                        duration: dur,
                        cycleDays: cycleDays
                    });
                }

                const validCycleList = history.map(h => h.cycleDays).filter(d => d !== null);
                const avgCycle = validCycleList.length > 0 
                    ? Math.round(validCycleList.reduce((a, b) => a + b, 0) / validCycleList.length)
                    : null;
                const avgDuration = Math.round(totalDuration / sorted.length);

                return { avgCycle, avgDuration, count: sorted.length, history: history.reverse() };
            }, [periods]);

            const calculations = React.useMemo(() => {
                if (periods.length === 0) {
                    return { predictedPeriod: [], ovulationPeriod: [], ovulationDay: null, nextStart: null, mode: "none" };
                }

                const sorted = [...periods].sort((a, b) => a.start.localeCompare(b.start));
                const lastPeriod = sorted[sorted.length - 1];

                let effectiveCycle = Number(cycleLength);
                let effectiveDuration = Number(periodDuration);
                let mode = "default";

                if (!useDefaultParams) {
                    if (stats.avgCycle && stats.avgDuration) {
                        effectiveCycle = stats.avgCycle;
                        effectiveDuration = stats.avgDuration;
                        mode = "history";
                    } else {
                        return { predictedPeriod: [], ovulationPeriod: [], ovulationDay: null, nextStart: null, mode: "need_more_data" };
                    }
                }

                const nextStart = addDays(lastPeriod.start, effectiveCycle);
                const predictedPeriod = [];
                for (let i = 0; i < effectiveDuration; i++) {
                    predictedPeriod.push(addDays(nextStart, i));
                }

                const ovulationDay = addDays(nextStart, -14);
                const ovulationPeriod = [];
                for (let i = -2; i <= 1; i++) {
                    ovulationPeriod.push(addDays(ovulationDay, i));
                }

                return { predictedPeriod, ovulationPeriod, ovulationDay, nextStart, mode };
            }, [periods, cycleLength, periodDuration, useDefaultParams, stats]);

            const handleDateClick = (dateStr) => {
                setNonConsecutiveNotice(false);
                setSelectedDates(prev => {
                    if (prev.includes(dateStr)) {
                        if (prev.length > 1) {
                            return prev.filter(d => d !== dateStr);
                        }
                        return prev;
                    } else {
                        return [...prev, dateStr].sort();
                    }
                });
            };

            const checkIsConsecutive = (datesArr) => {
                if (!datesArr || datesArr.length <= 1) return true;
                const sorted = [...datesArr].sort();
                for (let i = 0; i < sorted.length - 1; i++) {
                    if (diffDays(sorted[i], sorted[i + 1]) !== 1) {
                        return false;
                    }
                }
                return true;
            };

            const sortedSelectedDates = React.useMemo(() => [...selectedDates].sort(), [selectedDates]);
            const isConsecutive = React.useMemo(() => checkIsConsecutive(selectedDates), [selectedDates]);
            const primaryDateStr = sortedSelectedDates[0] || "";

            const getPeriodAtDate = (dateStr) => {
                return periods.find(p => dateStr >= p.start && dateStr <= p.end) || null;
            };

            const isAllSelectedInPeriod = sortedSelectedDates.length > 0 && sortedSelectedDates.every(d => getPeriodAtDate(d) !== null);

            const hasAnyDeletableContent = sortedSelectedDates.some(d => {
                const hasPeriod = getPeriodAtDate(d) !== null;
                const dayNote = notes[d];
                const hasIcons = dayNote?.icons && dayNote.icons.length > 0;
                const hasText = dayNote?.note && dayNote.note.trim().length > 0;
                return hasPeriod || hasIcons || hasText;
            });

            const applyMerge = (target, targetPeriod, refDate) => {
                let updated;
                if (target === 'before') {
                    updated = periods.map(p => {
                        if (p.id === targetPeriod.id) {
                            return { ...p, end: refDate };
                        }
                        return p;
                    });
                } else if (target === 'after') {
                    updated = periods.map(p => {
                        if (p.id === targetPeriod.id) {
                            return { ...p, start: refDate };
                        }
                        return p;
                    });
                }
                const nextPeriods = cleanAndMergePeriods(updated);
                setPeriods(nextPeriods);
                saveToCloud(nextPeriods, notes);
                setMergePrompt(null);
                setSelectedDates([]);
            };

            const handleCellMouseDown = (dateStr) => {
                isMouseDownRef.current = true;
                dragStartRef.current = dateStr;
                hasDraggedRef.current = false;
            };

            const handleCellMouseEnter = (dateStr) => {
                if (!isMouseDownRef.current || !dragStartRef.current) return;
                if (dateStr === dragStartRef.current) return;

                hasDraggedRef.current = true;
                setNonConsecutiveNotice(false);

                const d1 = parseDateStr(dragStartRef.current);
                const d2 = parseDateStr(dateStr);
                const startDate = d1 <= d2 ? d1 : d2;
                const endDate = d1 <= d2 ? d2 : d1;

                const range = [];
                let curr = new Date(startDate);
                while (curr <= endDate) {
                    range.push(toDateStr(curr));
                    curr.setDate(curr.getDate() + 1);
                }
                setSelectedDates(range);
            };

            const selectToday = () => {
                const todayStr = toDateStr(today);
                setViewDate(new Date(today.getFullYear(), today.getMonth(), 1));
                setSelectedDates([todayStr]);
                setNonConsecutiveNotice(false);
            };

            const removeDatesFromPeriods = (datesToRemove) => {
                let currentPeriods = [...periods];
                for (const dateStr of datesToRemove) {
                    const nextPeriods = [];
                    for (const p of currentPeriods) {
                        if (dateStr < p.start || dateStr > p.end) {
                            nextPeriods.push(p);
                            continue;
                        }
                        if (p.start === p.end && p.start === dateStr) {
                            continue;
                        }
                        if (p.start === dateStr) {
                            nextPeriods.push({ ...p, start: addDays(dateStr, 1) });
                        } else if (p.end === dateStr) {
                            nextPeriods.push({ ...p, end: addDays(dateStr, -1) });
                        } else {
                            nextPeriods.push({
                                id: Date.now().toString() + Math.random().toString().slice(2, 6) + '_a',
                                start: p.start,
                                end: addDays(dateStr, -1),
                                isClosed: p.isClosed
                            });
                            nextPeriods.push({
                                id: Date.now().toString() + Math.random().toString().slice(2, 6) + '_b',
                                start: addDays(dateStr, 1),
                                end: p.end,
                                isClosed: p.isClosed
                            });
                        }
                    }
                    currentPeriods = nextPeriods;
                }
                const nextMerged = cleanAndMergePeriods(currentPeriods);
                setPeriods(nextMerged);
                saveToCloud(nextMerged, notes);
                setSelectedDates([]);
            };

            const handlePeriodClick = () => {
                if (sortedSelectedDates.length === 0) return;

                if (isAllSelectedInPeriod) {
                    removeDatesFromPeriods(sortedSelectedDates);
                    return;
                }

                if (sortedSelectedDates.length > 1 && !isConsecutive) {
                    setNonConsecutiveNotice(true);
                    return;
                }

                setNonConsecutiveNotice(false);

                if (sortedSelectedDates.length > 1 && isConsecutive) {
                    const start = sortedSelectedDates[0];
                    const end = sortedSelectedDates[sortedSelectedDates.length - 1];
                    const newPeriod = {
                        id: Date.now().toString(),
                        start,
                        end,
                        isClosed: true
                    };
                    const nextPeriods = cleanAndMergePeriods([...periods, newPeriod]);
                    setPeriods(nextPeriods);
                    saveToCloud(nextPeriods, notes);
                    setSelectedDates([]);
                    return;
                }

                const singleDate = sortedSelectedDates[0];

                const beforePeriods = periods
                    .filter(p => p.end < singleDate && p.end >= addDays(singleDate, -3))
                    .sort((a, b) => b.end.localeCompare(a.end));

                const afterPeriods = periods
                    .filter(p => p.start > singleDate && p.start <= addDays(singleDate, 3))
                    .sort((a, b) => a.start.localeCompare(b.start));

                const hasBefore = beforePeriods.length > 0;
                const hasAfter = afterPeriods.length > 0;

                if (hasBefore && hasAfter) {
                    setMergePrompt({
                        targetDate: singleDate,
                        before: beforePeriods[0],
                        after: afterPeriods[0]
                    });
                    return;
                }

                if (hasBefore && !hasAfter) {
                    applyMerge('before', beforePeriods[0], singleDate);
                    return;
                }

                if (!hasBefore && hasAfter) {
                    applyMerge('after', afterPeriods[0], singleDate);
                    return;
                }

                const spanDays = Math.max(1, Number(periodDuration));
                const newPeriod = {
                    id: Date.now().toString(),
                    start: singleDate,
                    end: addDays(singleDate, spanDays - 1),
                    isClosed: true
                };
                const nextPeriods = cleanAndMergePeriods([...periods, newPeriod]);
                setPeriods(nextPeriods);
                saveToCloud(nextPeriods, notes);
                setSelectedDates([]);
            };

            const handleDeleteSelected = () => {
                if (sortedSelectedDates.length === 0) return;
                setNonConsecutiveNotice(false);

                const nextNotes = { ...notes };
                sortedSelectedDates.forEach(d => {
                    delete nextNotes[d];
                });
                setNotes(nextNotes);

                let currentPeriods = [...periods];
                for (const dateStr of sortedSelectedDates) {
                    const nextPeriods = [];
                    for (const p of currentPeriods) {
                        if (dateStr < p.start || dateStr > p.end) {
                            nextPeriods.push(p);
                            continue;
                        }
                        if (p.start === p.end && p.start === dateStr) {
                            continue;
                        }
                        if (p.start === dateStr) {
                            nextPeriods.push({ ...p, start: addDays(dateStr, 1) });
                        } else if (p.end === dateStr) {
                            nextPeriods.push({ ...p, end: addDays(dateStr, -1) });
                        } else {
                            nextPeriods.push({
                                id: Date.now().toString() + Math.random().toString().slice(2, 6) + '_a',
                                start: p.start,
                                end: addDays(dateStr, -1),
                                isClosed: p.isClosed
                            });
                            nextPeriods.push({
                                id: Date.now().toString() + Math.random().toString().slice(2, 6) + '_b',
                                start: addDays(dateStr, 1),
                                end: p.end,
                                isClosed: p.isClosed
                            });
                        }
                    }
                    currentPeriods = nextPeriods;
                }

                const nextMerged = cleanAndMergePeriods(currentPeriods);
                setPeriods(nextMerged);
                saveToCloud(nextMerged, nextNotes);
                setSelectedDates([]);
            };

            const toggleNoteIconBatch = (iconId) => {
                const nextNotes = { ...notes };
                const allHave = sortedSelectedDates.every(d => nextNotes[d]?.icons?.includes(iconId));

                sortedSelectedDates.forEach(d => {
                    const cur = nextNotes[d] || { icons: [], note: "" };
                    let newIcons = cur.icons || [];
                    if (allHave) {
                        newIcons = newIcons.filter(id => id !== iconId);
                    } else {
                        if (!newIcons.includes(iconId)) {
                            newIcons = [...newIcons, iconId];
                        }
                    }
                    nextNotes[d] = { ...cur, icons: newIcons };
                });
                setNotes(nextNotes);
                saveToCloud(periods, nextNotes);
            };

            const updateNoteTextBatch = (text) => {
                const nextNotes = { ...notes };
                sortedSelectedDates.forEach(d => {
                    const cur = nextNotes[d] || { icons: [], note: "" };
                    nextNotes[d] = { ...cur, note: text };
                });
                setNotes(nextNotes);
            };

            const handleExportBackup = () => {
                try {
                    const backupData = {
                        version: 1,
                        exportDate: toDateStr(new Date()),
                        periods,
                        notes,
                        settings: {
                            useDefaultParams,
                            cycleLength,
                            periodDuration,
                            showFertileWindow
                        }
                    };
                    const jsonStr = JSON.stringify(backupData, null, 2);
                    const blob = new Blob([jsonStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `生理期健康日誌_備份_${toDateStr(new Date())}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setBackupNotice({ type: 'success', text: '備份檔案下載成功！請妥善保存。' });
                    setTimeout(() => setBackupNotice(null), 4000);
                } catch (e) {
                    setBackupNotice({ type: 'error', text: '匯出失敗，請重試。' });
                }
            };

            const handleCopyBackupText = () => {
                try {
                    const backupData = {
                        version: 1,
                        exportDate: toDateStr(new Date()),
                        periods,
                        notes,
                        settings: {
                            useDefaultParams,
                            cycleLength,
                            periodDuration,
                            showFertileWindow
                        }
                    };
                    const jsonStr = JSON.stringify(backupData);
                    const textArea = document.createElement("textarea");
                    textArea.value = jsonStr;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    setBackupNotice({ type: 'success', text: '備份代碼已複製到剪貼簿！可貼至備忘錄。' });
                    setTimeout(() => setBackupNotice(null), 4000);
                } catch (e) {
                    setBackupNotice({ type: 'error', text: '複製失敗，請使用檔案下載備份。' });
                }
            };

            const applyBackupData = (jsonStr) => {
                try {
                    const data = JSON.parse(jsonStr);
                    if (!data || (!data.periods && !data.notes)) {
                        throw new Error("格式不正確");
                    }
                    const nextP = Array.isArray(data.periods) ? cleanAndMergePeriods(data.periods) : periods;
                    const nextN = (data.notes && typeof data.notes === 'object') ? data.notes : notes;

                    setPeriods(nextP);
                    setNotes(nextN);

                    let nextSettings = { useDefaultParams, cycleLength, periodDuration, showFertileWindow };
                    if (data.settings) {
                        if (typeof data.settings.useDefaultParams === 'boolean') {
                            setUseDefaultParams(data.settings.useDefaultParams);
                            nextSettings.useDefaultParams = data.settings.useDefaultParams;
                        }
                        if (data.settings.cycleLength) {
                            setCycleLength(Number(data.settings.cycleLength));
                            nextSettings.cycleLength = Number(data.settings.cycleLength);
                        }
                        if (data.settings.periodDuration) {
                            setPeriodDuration(Number(data.settings.periodDuration));
                            nextSettings.periodDuration = Number(data.settings.periodDuration);
                        }
                        if (typeof data.settings.showFertileWindow === 'boolean') {
                            setShowFertileWindow(data.settings.showFertileWindow);
                            nextSettings.showFertileWindow = data.settings.showFertileWindow;
                        }
                    }

                    saveToCloud(nextP, nextN, nextSettings);
                    setShowRestoreModal(false);
                    setRestoreText("");
                    setBackupNotice({ type: 'success', text: '備份資料還原成功！' });
                    setTimeout(() => setBackupNotice(null), 4000);
                } catch (err) {
                    setBackupNotice({ type: 'error', text: '還原失敗：檔案或文字格式錯誤！' });
                }
            };

            const handleFileImport = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    applyBackupData(event.target.result);
                };
                reader.readAsText(file);
                e.target.value = "";
            };

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayOfMonth = new Date(year, month, 1).getDay();

            const prevMonth = () => {
                setSlideDir("slide-right");
                setViewDate(new Date(year, month - 1, 1));
            };

            const nextMonth = () => {
                setSlideDir("slide-left");
                setViewDate(new Date(year, month + 1, 1));
            };

            const touchStartX = React.useRef(0);
            const touchStartY = React.useRef(0);

            const handleTouchStart = (e) => {
                touchStartX.current = e.touches[0].clientX;
                touchStartY.current = e.touches[0].clientY;
            };

            const handleTouchEnd = (e) => {
                const deltaX = e.changedTouches[0].clientX - touchStartX.current;
                const deltaY = e.changedTouches[0].clientY - touchStartY.current;
                if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                    if (deltaX < 0) nextMonth();
                    else prevMonth();
                }
            };

            // 構建月曆格子：月初補上前月至週日，月底補上下月至週六
            const calendarCells = [];
            const prevMonthLastDate = new Date(year, month, 0).getDate();
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const d = prevMonthLastDate - i;
                const prevDate = new Date(year, month - 1, d);
                calendarCells.push({
                    dayNum: d,
                    dateStr: toDateStr(prevDate),
                    isCurrentMonth: false
                });
            }
            for (let i = 1; i <= daysInMonth; i++) {
                const curDate = new Date(year, month, i);
                calendarCells.push({
                    dayNum: i,
                    dateStr: toDateStr(curDate),
                    isCurrentMonth: true
                });
            }
            const lastDayOfWeek = new Date(year, month, daysInMonth).getDay();
            if (lastDayOfWeek < 6) {
                const padCount = 6 - lastDayOfWeek;
                for (let i = 1; i <= padCount; i++) {
                    const nextDate = new Date(year, month + 1, i);
                    calendarCells.push({
                        dayNum: i,
                        dateStr: toDateStr(nextDate),
                        isCurrentMonth: false
                    });
                }
            }

            const getDayStatus = (dateStr) => {
                const activePeriod = getPeriodAtDate(dateStr);
                const isPeriod = !!activePeriod;
                const isPeriodStart = activePeriod?.start === dateStr;
                const isPeriodEnd = activePeriod?.end === dateStr;
                const isPredicted = calculations.predictedPeriod.includes(dateStr);
                const isOvulationDay = calculations.ovulationDay === dateStr;
                const isOvulationWindow = showFertileWindow && calculations.ovulationPeriod.includes(dateStr);
                return { isPeriod, isPeriodStart, isPeriodEnd, isPredicted, isOvulationDay, isOvulationWindow, activePeriod };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-28 px-4 pt-4 text-gray-800">
                    <div className="bg-white rounded-3xl p-5 shadow-sm border-t-8 border-rose-500 mb-4 flex justify-between items-center">
                        <div>
                            <div className="flex items-center gap-2">
                                <h1 className="text-xl font-black text-gray-800 flex items-center gap-1.5">
                                    <span className="text-rose-600"><Icon name="Heart" className="w-5 h-5 inline" /></span> 生理期日誌
                                </h1>
                                {apiToken && (
                                    <button
                                        type="button"
                                        onClick={fetchFromCloud}
                                        title={cloudStatus === 'loading' ? '正在讀取雲端...' : cloudStatus === 'saving' ? '正在同步至雲端...' : '點擊手動同步雲端'}
                                        className={`flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold transition-all active:scale-95 cursor-pointer ${
                                            cloudStatus === 'loading' || cloudStatus === 'saving'
                                                ? 'bg-amber-100 text-amber-700 animate-pulse'
                                                : cloudStatus === 'synced'
                                                    ? 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'
                                                    : 'bg-rose-50 text-rose-600 hover:bg-rose-100'
                                        }`}
                                    >
                                        <Icon name={cloudStatus === 'loading' || cloudStatus === 'saving' ? "Loader" : "Cloud"} className="w-3 h-3" />
                                        <span>
                                            {cloudStatus === 'loading' ? '載入中' : cloudStatus === 'saving' ? '同步中' : '雲端同步'}
                                        </span>
                                    </button>
                                )}
                            </div>
                            <p className="text-xs text-gray-400 font-medium mt-0.5">
                                {cloudStatus === 'loading' ? '正在與雲端確認最新紀錄...' : (lastCloudSyncTime ? `上次同步：${lastCloudSyncTime}` : '預測經期與日常症狀追蹤')}
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { setShowStats(!showStats); setShowSettings(false); }}
                                className={`p-3 rounded-2xl transition-all active:scale-95 ${showStats ? 'bg-rose-600 text-white shadow-sm' : 'bg-rose-50 text-rose-600'}`}
                                title="歷史週期統計"
                            >
                                <Icon name="BarChart" className="w-5 h-5" />
                            </button>
                            <button
                                onClick={() => { setShowSettings(!showSettings); setShowStats(false); }}
                                className={`p-3 rounded-2xl transition-all active:scale-95 ${showSettings ? 'bg-rose-600 text-white shadow-sm' : 'bg-rose-50 text-rose-600'}`}
                                title="參數設定"
                            >
                                <Icon name="Settings" className="w-5 h-5" />
                            </button>
                        </div>
                    </div>

                    {showSettings && (
                        <div className="bg-white rounded-3xl p-5 shadow-sm mb-4 border border-rose-100 space-y-4 animate-in fade-in">
                            <div className="flex justify-between items-center border-b border-rose-50 pb-2">
                                <h3 className="font-bold text-sm text-rose-600">週期預測參數設定</h3>
                                <button onClick={() => setShowSettings(false)} className="text-xs text-gray-400 hover:text-gray-600 font-bold">關閉</button>
                            </div>

                            <div className="flex items-center justify-between p-3 bg-rose-50/70 rounded-2xl">
                                <div>
                                    <div className="text-xs font-bold text-gray-800">使用預設參數推算</div>
                                    <div className="text-[10px] text-gray-500">關閉時將嚴格依照歷史真實平均推算</div>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setUseDefaultParams(!useDefaultParams)}
                                    className={`w-12 h-6 flex items-center rounded-full p-1 transition-all ${useDefaultParams ? 'bg-rose-600 justify-end' : 'bg-gray-300 justify-start'}`}
                                >
                                    <span className="bg-white w-4 h-4 rounded-full shadow-md"></span>
                                </button>
                            </div>

                            <div className="grid grid-cols-2 gap-3 text-xs font-bold text-gray-600">
                                <div>
                                    <label className="block mb-1">預設週期長度 (天)</label>
                                    <input
                                        type="number"
                                        disabled={!useDefaultParams}
                                        value={cycleLength}
                                        onChange={e => setCycleLength(Math.max(15, Number(e.target.value)))}
                                        className="w-full bg-rose-50/60 border border-rose-200 rounded-xl p-2.5 font-mono text-center font-bold text-gray-800 outline-none focus:border-rose-500 disabled:opacity-40"
                                    />
                                </div>
                                <div>
                                    <label className="block mb-1">預設經期天數 (天)</label>
                                    <input
                                        type="number"
                                        value={periodDuration}
                                        onChange={e => setPeriodDuration(Math.max(1, Number(e.target.value)))}
                                        className="w-full bg-rose-50/60 border border-rose-200 rounded-xl p-2.5 font-mono text-center font-bold text-gray-800 outline-none focus:border-rose-500"
                                    />
                                </div>
                            </div>

                            <div className="flex items-center justify-between pt-1">
                                <span className="text-xs font-bold text-gray-700">顯示易孕期標記</span>
                                <input
                                    type="checkbox"
                                    checked={showFertileWindow}
                                    onChange={e => setShowFertileWindow(e.target.checked)}
                                    className="w-4 h-4 accent-rose-600 rounded cursor-pointer"
                                />
                            </div>

                            <div className="pt-2 border-t border-rose-100">
                                <div className="text-xs font-bold text-gray-700 mb-1 flex items-center justify-between">
                                    <span>資料備份與還原</span>
                                    <span className="text-[10px] text-gray-400 font-normal">本機共 {periods.length} 筆經期</span>
                                </div>
                                <p className="text-[10px] text-gray-400 mb-3 leading-relaxed">

                                </p>

                                {backupNotice && (

                                        <span>{backupNotice.type === 'success' ? '✓' : '⚠️'}</span>
                                        <span>{backupNotice.text}</span>
                                    </div>

                                        <Icon name="Download" className="w-3.5 h-3.5" />
                                        <span>下載備份檔</span>
                                    </button>

                                    <button

                                        <Icon name="Copy" className="w-3.5 h-3.5" />

                                </div>

                                <div className="mt-2">

                                        <span>讀取還原備份資料</span>
                                    </button>
                                </div>

                                <input
                                    type="file"
                                    ref={fileInputRef}
                                    onChange={handleFileImport}
                                    accept=".json"
                                    className="hidden"
                                />
                            </div>
                        </div>
                    )}

                    {showStats && (
                        <div className="bg-white rounded-3xl p-5 shadow-sm mb-4 border border-rose-100 space-y-4 animate-in fade-in">
                            <div className="flex justify-between items-center border-b border-rose-50 pb-2">
                                <h3 className="font-bold text-sm text-rose-600">週期預測與歷史統計</h3>
                                <button onClick={() => setShowStats(false)} className="text-xs text-gray-400 hover:text-gray-600 font-bold">關閉</button>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-gradient-to-br from-red-500 to-rose-600 text-white p-3.5 rounded-2xl shadow-sm shadow-rose-200">
                                    <div className="text-[10px] font-medium opacity-90">下次預測經期</div>
                                    <div className="text-sm font-black mt-1">
                                        {calculations.nextStart ? calculations.nextStart.replace(/-/g, ' / ') : (
                                            calculations.mode === "need_more_data" ? "需記錄至少2次" : "記錄後推算"
                                        )}
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-purple-600 to-rose-500 text-white p-3.5 rounded-2xl shadow-sm shadow-purple-100">
                                    <div className="text-[10px] font-medium opacity-90 flex items-center gap-1">
                                        <span>預測排卵日</span>
                                        <Icon name="Sparkles" className="w-2.5 h-2.5" />
                                    </div>
                                    <div className="text-sm font-black mt-1">
                                        {calculations.ovulationDay ? calculations.ovulationDay.replace(/-/g, ' / ') : (
                                            calculations.mode === "need_more_data" ? "需記錄至少2次" : "記錄後推算"
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 text-center">
                                <div className="bg-rose-50/70 p-3 rounded-2xl">
                                    <div className="text-[10px] text-gray-500 font-bold">歷史平均週期</div>
                                    <div className="text-lg font-black text-rose-600 mt-0.5">
                                        {stats.avgCycle ? `${stats.avgCycle} 天` : '資料不足 (需2次)'}
                                    </div>
                                </div>
                                <div className="bg-rose-50/70 p-3 rounded-2xl">
                                    <div className="text-[10px] text-gray-500 font-bold">平均經期天數</div>
                                    <div className="text-lg font-black text-red-600 mt-0.5">
                                        {stats.avgDuration ? `${stats.avgDuration} 天` : '尚未記錄'}
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div className="text-xs font-bold text-gray-700 mb-2">歷史記錄列表 ({periods.length} 筆)</div>
                                {stats.history.length === 0 ? (
                                    <div className="text-xs text-gray-400 text-center py-4 bg-gray-50 rounded-2xl">
                                        尚未有完整的經期記錄，請在日曆上點選開始記錄。
                                    </div>
                                ) : (
                                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                        {stats.history.map(item => (
                                            <div key={item.id} className="flex justify-between items-center p-2.5 bg-rose-50/50 rounded-xl text-xs">
                                                <div>
                                                    <div className="font-bold text-gray-700 font-mono">
                                                        {item.start} ~ {item.end}
                                                    </div>
                                                    <div className="text-[10px] text-gray-400">
                                                        來潮 {item.duration} 天 {item.cycleDays ? `· 週期相隔 ${item.cycleDays} 天` : '· (首筆記錄)'}
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        const next = periods.filter(p => p.id !== item.id);
                                                        setPeriods(next);
                                                        saveToCloud(next, notes);
                                                    }}
                                                    className="p-2 text-gray-400 hover:text-red-500 rounded-lg active:scale-95 cursor-pointer"
                                                    title="刪除此筆記錄"
                                                >
                                                    <Icon name="Trash" className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 未綁定金鑰提示列 */}
                    {!apiToken && (
                        <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-xs font-bold flex items-center justify-between animate-in fade-in">
                            <div className="flex items-center gap-1.5">
                                <span>⚠️</span>
                                <span>未驗證金鑰，目前為單機離線模式</span>
                            </div>
                            <button
                                type="button"
                                onClick={() => {
                                    const key = prompt("請輸入金鑰 (ID) 以同步雲端資料：");
                                    if (key && key.trim()) {
                                        safeStorage.setItem('api_token_id', key.trim());
                                        window.location.reload();
                                    }
                                }}
                                className="px-2.5 py-1 bg-amber-200 hover:bg-amber-300 text-amber-950 rounded-lg font-black text-[11px] active:scale-95 transition-all cursor-pointer"
                            >
                                輸入金鑰
                            </button>
                        </div>
                    )}

                    {/* 月曆卡片區塊 */}
                    <div
                        className="bg-white rounded-3xl p-5 shadow-sm mb-4 relative"
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                    >
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={prevMonth} className="p-2 hover:bg-rose-50 text-rose-600 rounded-full active:scale-90 transition-all">
                                <Icon name="ChevronLeft" className="w-5 h-5" />
                            </button>
                            <div className="flex items-center gap-2">
                                <h2 className="text-base font-black text-gray-800 tracking-wide">
                                    {year} 年 {month + 1} 月
                                </h2>
                                <button
                                    type="button"
                                    onClick={selectToday}
                                    className="text-[11px] bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold px-2 py-0.5 rounded-lg active:scale-95 transition-all cursor-pointer"
                                    title="點選自動切換並選取今天"
                                >
                                    今天
                                </button>
                            </div>
                            <button onClick={nextMonth} className="p-2 hover:bg-rose-50 text-rose-600 rounded-full active:scale-90 transition-all">
                                <Icon name="ChevronRight" className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="grid grid-cols-7 text-center text-xs font-bold text-rose-300 mb-2">
                            {['日', '一', '二', '三', '四', '五', '六'].map(d => <div key={d} className="py-1">{d}</div>)}
                        </div>

                        <div className={`grid grid-cols-7 gap-1 text-center font-bold select-none ${slideDir}`}>
                            {calendarCells.map((cell) => {
                                const { dayNum, dateStr, isCurrentMonth } = cell;
                                const isTodayDate = dateStr === toDateStr(today);
                                const status = getDayStatus(dateStr);
                                const isSelected = selectedDates.includes(dateStr);
                                const dayNote = notes[dateStr];

                                let bgStyle = isCurrentMonth ? "text-gray-700 hover:bg-rose-50" : "text-gray-400 hover:bg-rose-50/50 bg-gray-50/30";
                                if (status.isPeriod) {
                                    bgStyle = isCurrentMonth
                                        ? "bg-red-500 text-white font-black shadow-sm shadow-red-200"
                                        : "bg-red-400/80 text-white font-black shadow-sm";
                                } else if (status.isPredicted) {
                                    bgStyle = isCurrentMonth
                                        ? "bg-rose-50 text-rose-700 border-2 border-dashed border-rose-400"
                                        : "bg-rose-50/40 text-rose-300 border-2 border-dashed border-rose-300";
                                } else if (status.isOvulationDay) {
                                    bgStyle = isCurrentMonth
                                        ? "bg-[#460b99] text-white font-black shadow-sm shadow-purple-200"
                                        : "bg-[#460b99]/80 text-white font-black shadow-sm";
                                } else if (status.isOvulationWindow) {
                                    bgStyle = isCurrentMonth
                                        ? "bg-purple-100 text-purple-700"
                                        : "bg-purple-50 text-purple-300";
                                }

                                return (
                                    <button
                                        key={dateStr}
                                        type="button"
                                        onMouseDown={() => handleCellMouseDown(dateStr)}
                                        onMouseEnter={() => handleCellMouseEnter(dateStr)}
                                        onClick={() => {
                                            if (hasDraggedRef.current) return;
                                            handleDateClick(dateStr);
                                        }}
                                        className={`aspect-square rounded-2xl flex flex-col items-center justify-between p-1 transition-all relative ${bgStyle} ${
                                            isSelected ? 'ring-2 ring-red-500 ring-offset-2 scale-95 z-10' : ''
                                        }`}
                                    >
                                        <span className={`text-xs font-bold mt-0.5 flex items-center gap-0.5 ${
                                            isTodayDate && !status.isPeriod && !status.isOvulationDay
